name: local_flutter_builder
description: A fully local visual editor for Flutter application prototypes.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  analyzer: ^8.4.1
  dart_eval: ^0.8.5
  flutter:
    sdk: flutter
  file_selector: ^1.0.4
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  provider: 6.1.5

  highlight: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
